name: JBF Server Stalker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  palworld-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Query JBF Palworld and save player count
        env:
          PALWORLD_ADMIN_PASSWORD: ${{ secrets.PALWORLD_ADMIN_PASSWORD }}
        run: |
          echo "Querying JBF- Pals and Poachers Day Shift..."

          RESPONSE=$(curl --silent --show-error \
            --user "admin:${PALWORLD_ADMIN_PASSWORD}" \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            "http://85.190.159.217:17123/v1/api/players")

          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "QUERY FAILED"
            exit 1
          fi

          PLAYER_COUNT=$(echo "$BODY" | jq '.players | length')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "SUCCESS!"
          echo "Time: $TIMESTAMP"
          echo "Players Online: $PLAYER_COUNT"

          mkdir -p data

          if [ ! -f data/palworld-day-shift.csv ]; then
            echo "timestamp,players_online" > data/palworld-day-shift.csv
          fi

          echo "$TIMESTAMP,$PLAYER_COUNT" >> data/palworld-day-shift.csv

      - name: Save reading to repository
        run: |
          git config user.name "JBF Server Stalker"
          git config user.email "server-stalker@users.noreply.github.com"

          git add data/palworld-day-shift.csv

          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Server Stalker: Palworld player count"
            git push
          fi
